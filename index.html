<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Quản Lý Chi Tiêu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
            width: 100%;
        }

        /* --- Sidebar --- */
        .sidebar {
            background-color: #1e293b;
            color: #fff;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            height: 100vh;
            position: sticky;
            top: 0;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #38bdf8;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            position: relative;
        }

        .menu-item a {
            display: block;
            padding: 12px 16px;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .menu-item.active > a, .menu-item > a:hover {
            background-color: #334155;
            color: #fff;
        }

        /* --- Main Content --- */
        .main-content {
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            width: 100%;
        }

        /* Cards */
        .cards-container {
            display: flex;
            gap: 24px;
            width: 100%;
        }

        .card {
            background: #fff;
            flex: 1;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .card-title {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .card-value {
            font-size: 24px;
            font-weight: 700;
        }

        .income { color: #10b981; }
        .expense { color: #ef4444; }
        .balance { color: #3b82f6; }

        /* Chia cột Layout */
        .data-section {
            display: grid;
            grid-template-columns: 65% 35%;
            gap: 24px;
            width: 100%;
        }

        .panel {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1e293b;
        }

        /* Table */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .transaction-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .transaction-table th, .transaction-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
        }

        .transaction-table th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
        }

        .transaction-table tbody tr:hover {
            background-color: #f1f5f9;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Thanh công cụ Sidebar trái -->
    <aside class="sidebar">
        <div class="logo">FINANCE.DASH</div>
        <ul class="menu-list">
            <li class="menu-item active"><a href="#">Tổng quan</a></li>
            <li class="menu-item"><a href="#">Lịch sử giao dịch</a></li>
            <!-- Đã xóa phần Danh mục và Cài đặt tại đây -->
        </ul>
    </aside>

    <main class="main-content">
        <!-- Hàng 3 thẻ thống kê -->
        <section class="cards-container">
            <div class="card">
                <div class="card-title">Tổng thu nhập</div>
                <div class="card-value income" id="total-income">+0đ</div>
            </div>
            <div class="card">
                <div class="card-title">Tổng chi tiêu</div>
                <div class="card-value expense" id="total-expense">-0đ</div>
            </div>
            <div class="card">
                <div class="card-title">Số dư còn lại</div>
                <div class="card-value balance" id="total-balance">0đ</div>
            </div>
        </section>

        <section class="data-section">
            <!-- CỘT TRÁI: BẢNG CHỨA DỮ LIỆU CHÈN TỪ JS -->
            <div class="panel">
                <div class="panel-title">Danh sách giao dịch gần nhất</div>
                <div class="table-responsive">
                    <table class="transaction-table">
                        <thead>
                            <tr>
                                <th>Ngày giao dịch</th>
                                <th>Tên danh mục</th>
                                <th>Ghi chú</th>
                                <th>Số tiền</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-data">
                            <!-- Chờ nhập liệu -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- CỘT PHẢI: FORM NHẬP -->
            <div class="panel">
                <div class="panel-title">Nhập giao dịch mới</div>
                <form id="transaction-form" style="display: flex; flex-direction: column; gap: 12px;">
                    <div style="display: flex; gap: 12px;">
                        <input type="date" id="input-date" required style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit;">
                        <select id="input-category" required style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit;">
                            <option value="🍔 Ăn uống">🍔 Ăn uống</option>
                            <option value="🚌 Di chuyển">🚌 Di chuyển</option>
                            <option value="🛍️ Mua sắm">🛍️ Mua sắm</option>
                            <option value="🎬 Giải trí">🎬 Giải trí</option>
                            <option value="💰 Thu nhập">💰 Thu nhập</option>
                        </select>
                    </div>
                    <input type="text" id="input-note" placeholder="Ghi chú (Ví dụ: Ăn trưa, Nhận lương...)" required style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit;">
                    <div style="display: flex; gap: 12px; align-items: center;">
                        <input type="number" id="input-amount" placeholder="Số tiền (Ví dụ: 50000)" required style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit;">
                        <select id="input-type" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; background-color: #f8fafc;">
                            <option value="expense">Chi tiêu (-)</option>
                            <option value="income">Thu nhập (+)</option>
                        </select>
                    </div>
                    <button type="submit" style="background-color: #3b82f6; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer;">
                        + Thêm Giao Dịch
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- XỬ LÝ JAVASCRIPT -->
    <script>
        const danhSachGiaoDich = [];

        function formatTien(soTien) {
            const dinhDangSo = Math.abs(soTien).toLocaleString('vi-VN');
            return soTien > 0 ? `+${dinhDangSo}đ` : `-${dinhDangSo}đ`;
        }

        function formatNgay(ngayInput) {
            if(!ngayInput) return "";
            const parts = ngayInput.split('-');
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function capNhatThongKe() {
            let tongThu = 0;
            let tongChi = 0;

            danhSachGiaoDich.forEach(gd => {
                if (gd.soTien > 0) {
                    tongThu += gd.soTien;
                } else {
                    tongChi += Math.abs(gd.soTien);
                }
            });

            let soDu = tongThu - tongChi;

            document.getElementById("total-income").innerText = `+${tongThu.toLocaleString('vi-VN')}đ`;
            document.getElementById("total-expense").innerText = `-${tongChi.toLocaleString('vi-VN')}đ`;
            document.getElementById("total-balance").innerText = `${soDu >= 0 ? '+' : ''}${soDu.toLocaleString('vi-VN')}đ`;
        }

        function doDuLieuLenBang() {
            const tbody = document.getElementById("transaction-data");
            let chuoiHTML = "";

            if(danhSachGiaoDich.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 20px;">Chưa có dữ liệu. Hãy nhập giao dịch mới bên phải!</td></tr>`;
                capNhatThongKe();
                return;
            }

            danhSachGiaoDich.forEach(gd => {
                const classMauSac = gd.soTien > 0 ? "income" : "expense";
                chuoiHTML += `
                    <tr>
                        <td>${gd.ngay}</td>
                        <td>${gd.danhMuc}</td>
                        <td>${gd.ghiChu}</td>
                        <td class="${classMauSac}">${formatTien(gd.soTien)}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = chuoiHTML;
            capNhatThongKe();
        }

        document.getElementById("transaction-form").addEventListener("submit", function(e) {
            e.preventDefault();

            const ngayRaw = document.getElementById("input-date").value;
            const danhMuc = document.getElementById("input-category").value;
            const ghiChu = document.getElementById("input-note").value;
            let soTien = parseFloat(document.getElementById("input-amount").value);
            const loaiGiaoDich = document.getElementById("input-type").value;

            if (loaiGiaoDich === "expense") {
                soTien = -soTien;
            }

            const giaoDichMoi = {
                ngay: formatNgay(ngayRaw),
                danhMuc: danhMuc,
                ghiChu: ghiChu,
                soTien: soTien
            };

            danhSachGiaoDich.unshift(giaoDichMoi);

            doDuLieuLenBang();
            document.getElementById("transaction-form").reset();
            document.getElementById("input-date").valueAsDate = new Date();
        });

        window.onload = function() {
            doDuLieuLenBang();
            document.getElementById("input-date").valueAsDate = new Date();
        };
    </script>
</body>
</html>
